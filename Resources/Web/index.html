<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <title>Makr Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --line: rgba(255,255,255,.09);
      --muted: #8f96a8;
      --text: #f4f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body { color: var(--text); touch-action: manipulation; }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: calc(env(safe-area-inset-top) + 7px) 12px calc(env(safe-area-inset-bottom) + 8px);
      gap: 8px;
    }
    header {
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 3px;
    }
    .glyph {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: #f4f6ff;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 9px;
      background: linear-gradient(145deg, #343a51, #151822 70%);
      box-shadow: inset 0 1px rgba(255,255,255,.12), 0 4px 12px rgba(0,0,0,.24);
      font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .title-wrap { display: flex; flex-direction: column; min-width: 0; }
    .title { font-size: 15px; font-weight: 650; letter-spacing: -.2px; line-height: 18px; }
    #status { color: var(--muted); font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spacer { flex: 1; }
    .header-button {
      min-width: 38px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #d9dded;
      background: rgba(255,255,255,.055);
      font: 600 12px/1 -apple-system, sans-serif;
    }
    #terminal {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      padding: 10px 9px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #080a10;
      box-shadow: 0 7px 24px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.025);
    }
    #terminal .xterm { height: 100%; }
    #terminal .xterm-viewport { overflow-y: auto !important; }
    #terminal .xterm-screen { width: 100% !important; }
    #keys {
      flex: 0 0 38px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 1px;
    }
    #keys::-webkit-scrollbar { display: none; }
    .key {
      flex: 0 0 auto;
      min-width: 42px;
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: #dfe3f1;
      background: linear-gradient(180deg, #171a25, #11141c);
      box-shadow: inset 0 1px rgba(255,255,255,.045);
      font: 600 12px/1 -apple-system, sans-serif;
    }
    .key:active, .header-button:active { background: #272d3b; }
    @media (min-width: 700px) {
      #app { max-width: 920px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
      #keys { justify-content: center; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <div class="glyph" aria-hidden="true">&gt;_</div>
      <div class="title-wrap">
        <div class="title">Терминал</div>
        <div id="status">Подключение…</div>
      </div>
      <div class="spacer"></div>
      <button class="header-button" id="clear" type="button">Очистить</button>
      <button class="header-button" id="restart" type="button" aria-label="Перезапустить shell">↻</button>
    </header>

    <section id="terminal" aria-label="Terminal screen"></section>

    <nav id="keys" aria-label="Terminal keys">
      <button class="key" data-key="ctrl-c" type="button">^C</button>
      <button class="key" data-key="ctrl-d" type="button">^D</button>
      <button class="key" data-key="tab" type="button">Tab</button>
      <button class="key" data-key="escape" type="button">Esc</button>
      <button class="key" data-key="up" type="button">↑</button>
      <button class="key" data-key="down" type="button">↓</button>
      <button class="key" data-key="left" type="button">←</button>
      <button class="key" data-key="right" type="button">→</button>
    </nav>
  </main>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script>
    (() => {
      const terminal = new Terminal({
        allowTransparency: false,
        convertEol: false,
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: 'SFMono-Regular, Menlo, Monaco, ui-monospace, monospace',
        fontSize: 14,
        lineHeight: 1.2,
        macOptionIsMeta: true,
        scrollback: 10000,
        theme: {
          background: '#080a10',
          foreground: '#eceef5',
          cursor: '#c4ceff',
          cursorAccent: '#080a10',
          selectionBackground: 'rgba(143, 162, 255, .35)',
          black: '#1b1e29', red: '#ff6b78', green: '#88d3a7', yellow: '#e8c879',
          blue: '#8aa5ff', magenta: '#d3a0ef', cyan: '#79c7d2', white: '#e8eaf2',
          brightBlack: '#747b8f', brightRed: '#ff8791', brightGreen: '#a4e3ba',
          brightYellow: '#f5da91', brightBlue: '#a6b8ff', brightMagenta: '#e0b5f4',
          brightCyan: '#98d9e0', brightWhite: '#ffffff'
        }
      });
      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(document.getElementById('terminal'));

      const resize = () => {
        try {
          fitAddon.fit();
          window.webkit.messageHandlers.ptyResize.postMessage({cols: terminal.cols, rows: terminal.rows});
        } catch (_) {}
      };
      const observer = new ResizeObserver(resize);
      observer.observe(document.getElementById('terminal'));
      window.addEventListener('orientationchange', () => setTimeout(resize, 120));
      window.addEventListener('resize', resize);
      terminal.onData(data => window.webkit.messageHandlers.ptyInput.postMessage(data));

      document.getElementById('clear').addEventListener('click', () => {
        terminal.clear();
        terminal.focus();
      });
      document.getElementById('restart').addEventListener('click', () => {
        window.webkit.messageHandlers.terminalRestart.postMessage(true);
        terminal.focus();
      });
      const keySequences = {
        'ctrl-c': '\x03', 'ctrl-d': '\x04', tab: '\t', escape: '\x1b',
        up: '\x1b[A', down: '\x1b[B', left: '\x1b[D', right: '\x1b[C'
      };
      document.querySelectorAll('[data-key]').forEach(button => {
        button.addEventListener('click', () => {
          window.webkit.messageHandlers.ptyInput.postMessage(keySequences[button.dataset.key]);
          terminal.focus();
        });
      });

      const decoder = new TextDecoder('utf-8');
      window.makrTerminal = {
        writeBase64(value) {
          const binary = atob(value);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          terminal.write(decoder.decode(bytes, {stream: true}));
        },
        setStatus(value) { document.getElementById('status').textContent = value; },
        reset() { terminal.reset(); },
        focus() { terminal.focus(); }
      };

      requestAnimationFrame(() => {
        resize();
        window.webkit.messageHandlers.terminalReady.postMessage(true);
      });
      document.getElementById('terminal').addEventListener('click', () => terminal.focus());
    })();
  </script>
</body>
</html>
